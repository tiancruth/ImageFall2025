<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <!-- 
        <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
        <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
        <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
        <a-sky color="#ECECEC"></a-sky> 

        example of how to add an image to the scene

        <img id= "name" src="path/to/your/image.jpg" alt="imagenme"> 

        
       DONT FORGET THE HASHTAGE ###########
        <a-box src="#img id name" position="x y z" rotation="x y z" width="" height="" depth="" etc... ></a-box>
      -->

      <!-- makes movement faster! -->
        <a-entity 
            id="cameraRig"
            camera
            look-controls
            wasd-controls="acceleration: 300">
        </a-entity>

        <!-- IMAGE IDS SECTION -->
        <img id= "forest" src="assets/forest_edited.jpg" alt="Equirectangular image of forest">
        <!-- IMAGE IDS SECTION-->


        <a-sky src="#forest"></a-sky> 

        <a-entity 
          id="ghost"
          gltf-model="url(./assets/spooky_ghost.glb)" 
          position="0 -10 -50"
          rotation="0 0 0"
          scale="2 2 2">
        </a-entity>

        <a-entity 
          id="lamp"
          gltf-model="url(./assets/streetlamp3dmodel.glb)" 
          position="-30 -10 -60"
          rotation="0 0 0"
          scale="40 40 40">
        </a-entity>

        <a-entity 
          id="lamp"
          gltf-model="url(./assets/streetlamp3dmodel.glb)" 
          position="30 -10 -60"
          rotation="0 0 0"
          scale="30 30 30">
        </a-entity>

        <a-entity>
          <a-light 
            type="point" 
            color="#ffffff" 
            intensity="2" 
            distance="50" 
            position="0 10 -40">
          </a-light>
        </a-entity>
  
    </a-scene>
  </body>
  <script>
    AFRAME.registerComponent('float', 
    {
      tick: function(time) 
      {
        // this makes it so ghost goes up and down like it's floating
        const yOffset = Math.sin(time / 1000) * 2; // so it floats 2 units up and down
        const xOffset = Math.sin(time / 1500) * 1; // this makes it look like ghost is going slightly side to side

        // set the new position of the ghost, need this part so ghost actually like does the movements
        this.el.setAttribute('position', 
        {
          x: xOffset,
          y: -10 + yOffset,
          z: -50
        });
      }
    });
    
    // this actually applies like, the component to the ghost
    document.querySelector('#ghost').setAttribute('float', '');
  </script>
</html>
